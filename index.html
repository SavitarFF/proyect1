<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Música Moderno</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1f1c2c, #62d8e0);
            color: white;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 350px;
            max-width: 800px;
            height: 450px; 
        }

        #canvas {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border-radius: 15px; 
            z-index: 1; 
        }

        .player-wrapper {
            position: relative;
            z-index: 2; 
            padding: 20px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%; 
            backdrop-filter: blur(10px); 
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .controls button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: rgb(0, 0, 0);
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        input[type="file"] {
            margin-top: -12px;
            padding: 10px;
            font-size: 12px;
            color: #000000;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            outline: none;
            border-radius: 10px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        input[type="file"]:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .cover img {
            width: 100%;
            height: 80%;
            border-radius: 10px;
            margin-top: 0px;
            opacity: 0.7;
        }

    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="player-wrapper">
            <div class="cover">
                <img id="cover-img" src="https://wallpapercave.com/wp/wp2881795.jpg" alt="Cover Art">
            </div>
            <input type="file" id="file-input" accept="audio/*" />
            <audio id="audio"></audio>
            <div class="controls">
                <button id="prev-btn"><i class="fas fa-backward"></i></button>
                <button id="play-btn"><i class="fas fa-play"></i></button>
                <button id="next-btn"><i class="fas fa-forward"></i></button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const audioElement = document.getElementById('audio');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth * 0.9;
        canvas.height = 450;

        let audioContext, analyser, dataArray;

        fileInput.onchange = function(event) {
            const file = event.target.files[0];
            const audioURL = URL.createObjectURL(file);
            audioElement.src = audioURL;

            
            audioContext = new AudioContext();
            const audioSource = audioContext.createMediaElementSource(audioElement);
            analyser = audioContext.createAnalyser();

            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);

            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            draw();
        };

        function draw() {
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / dataArray.length) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < dataArray.length; i++) {
                barHeight = dataArray[i];

               
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, `rgba(31, 209, 203, ${barHeight / 255})`);
                gradient.addColorStop(1, `rgba(255, 255, 255, ${barHeight / 255})`);

                ctx.fillStyle = gradient;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

               
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';

                x += barWidth + 1;
            }
        }

        document.getElementById('play-btn').addEventListener('click', () => {
            if (audioElement.paused) {
                audioElement.play();
                audioContext.resume(); 
            } else {
                audioElement.pause();
            }
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            
        });
    </script>
</body>
</html>
